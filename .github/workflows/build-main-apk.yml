name: Build and Release Standalone Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign and Package Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Style & Analyzer
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Create Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/app/release-key.jks \
            -alias releaseKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "bouncyballsecret" \
            -keypass "bouncyballsecret" \
            -dname "CN=bouncyball.example.com, OU=BouncyBall, O=BouncyBallCorp, L=Austin, S=Texas, C=US"

      - name: Configure Keystore signing configs
        run: |
          cat <<EOF > android/key.properties
          storePassword=bouncyballsecret
          keyPassword=bouncyballsecret
          keyAlias=releaseKey
          storeFile=release-key.jks
          EOF

      - name: Build Standalone Signed APK
        run: flutter build apk --release

      - name: Verify APK Location
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Generate Tag & Release Metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.0-build-${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name is ${TAG_NAME}"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: Release ${{ steps.meta.outputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
